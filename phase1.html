<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PTE Journey · المرحلة الأولى</title>

<!-- PWA: installable app support -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0F1A">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<!-- iOS-specific: makes "Add to Home Screen" open full-screen with no browser bar -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PTE Journey">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0F1A;--s1:#111827;--s2:#1A2235;--s3:#1F2A3D;--border:rgba(255,255,255,0.07);--b2:rgba(255,255,255,0.04);--accent:#38BDF8;--a2:#0284C7;--aglow:rgba(56,189,248,0.10);--gold:#FBBF24;--gold2:#FDE68A;--green:#34D399;--red:#F87171;--purple:#A78BFA;--orange:#FB923C;--text:#E2E8F0;--muted:#64748B;--muted2:#94A3B8;--cg:#60A5FA;--cl:#A78BFA;--cr:#34D399;--cw:#FB923C}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{position:sticky;top:0;z-index:100;background:rgba(11,15,26,0.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:10px 16px}
.tb-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px}
.tb-title{font-family:'IBM Plex Mono',monospace;font-size:0.82rem;color:var(--accent);font-weight:600;white-space:nowrap}
.tb-prog{flex:1}
.tb-meta{display:flex;justify-content:space-between;font-size:0.62rem;color:var(--muted);margin-bottom:4px;font-family:'IBM Plex Mono',monospace}
.tb-track{height:3px;background:var(--s2);border-radius:99px;overflow:hidden}
.tb-fill{height:100%;background:linear-gradient(90deg,var(--a2),var(--accent));border-radius:99px;transition:width 0.6s ease}
.phase-tag{font-family:'IBM Plex Mono',monospace;font-size:0.62rem;padding:3px 9px;border-radius:4px;border:1px solid rgba(96,165,250,0.3);background:rgba(96,165,250,0.07);color:var(--cg);white-space:nowrap}
main{max-width:900px;margin:0 auto;padding:20px 16px 60px}
.week-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.wk-btn{font-family:'IBM Plex Mono',monospace;font-size:0.62rem;padding:5px 12px;border-radius:5px;border:1px solid var(--border);background:var(--s1);color:var(--muted);cursor:pointer;transition:all 0.2s}
.wk-btn:hover,.wk-btn.active{border-color:var(--accent);color:var(--accent);background:var(--aglow)}
.wk-btn.done{border-color:rgba(52,211,153,0.3);color:var(--green);background:rgba(52,211,153,0.06)}
.day-list{display:grid;gap:8px;margin-bottom:24px}
.day-card{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:12px}
.day-card:hover{border-color:rgba(255,255,255,0.15);background:var(--s2)}
.day-card.active{border-color:var(--accent);background:var(--aglow)}
.day-card.done{border-color:rgba(52,211,153,0.25);background:rgba(52,211,153,0.04)}
.dc-num{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--muted);width:48px;flex-shrink:0}
.dc-info{flex:1}
.dc-title{font-size:0.85rem;font-weight:600;color:var(--text)}
.dc-sub{font-size:0.7rem;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:2px}
.lesson-panel{background:var(--s1);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:20px;display:none}
.lp-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.lp-title{font-size:0.95rem;font-weight:700;color:#fff}
.lp-close{background:none;border:1px solid var(--border);color:var(--muted);padding:4px 12px;border-radius:5px;cursor:pointer;font-size:0.7rem;font-family:'IBM Plex Mono',monospace}
.lp-body{padding:20px}
.skill-sec{margin-bottom:24px;border-bottom:1px solid var(--b2);padding-bottom:20px}
.skill-sec:last-child{border-bottom:none;margin-bottom:0}
.ss-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.ss-label{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;font-weight:600;text-transform:uppercase;letter-spacing:0.06em}
.ss-time{font-family:'IBM Plex Mono',monospace;font-size:0.6rem;color:var(--muted);margin-left:auto;background:var(--s2);border:1px solid var(--border);padding:2px 8px;border-radius:4px}
.rule-box{background:rgba(96,165,250,0.05);border:1px solid rgba(96,165,250,0.18);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.rule-ar{font-family:'Tajawal',sans-serif;font-size:0.92rem;line-height:1.75;color:var(--text);margin-bottom:10px}
.rule-formula{font-family:'IBM Plex Mono',monospace;font-size:0.8rem;color:var(--accent);background:var(--s2);padding:8px 12px;border-radius:6px}
.sub-rule{background:var(--s3);border-radius:6px;padding:8px 11px;margin-bottom:6px}
.sr-case{font-family:'Tajawal',sans-serif;font-size:0.75rem;color:var(--gold);margin-bottom:3px}
.sr-en{font-family:'Inter',sans-serif;font-size:0.82rem;color:var(--text);margin-bottom:2px}
.sr-ar{font-family:'Tajawal',sans-serif;font-size:0.75rem;color:var(--muted2)}
.mistake-box{background:rgba(248,113,113,0.05);border:1px solid rgba(248,113,113,0.18);border-radius:7px;padding:9px 13px;margin-bottom:12px;font-family:'Tajawal',sans-serif;font-size:0.82rem;color:var(--red)}
.usa-tip{background:rgba(56,189,248,0.05);border:1px solid rgba(56,189,248,0.15);border-radius:7px;padding:8px 12px;margin-bottom:12px;font-size:0.75rem;color:var(--accent);font-family:'IBM Plex Mono',monospace}
.yt-box{display:flex;align-items:center;gap:10px;background:rgba(255,68,68,0.05);border:1px solid rgba(255,68,68,0.2);border-radius:8px;padding:10px 13px;margin:12px 0}
.yt-box a{color:#FF6B6B;font-family:'IBM Plex Mono',monospace;font-size:0.72rem;text-decoration:none}
.yt-box a:hover{text-decoration:underline}
.ex-card{background:var(--s2);border:1px solid var(--border);border-radius:7px;padding:9px 12px;margin-bottom:7px}
.ex-en{font-family:'Inter',sans-serif;font-size:0.85rem;color:var(--text);margin-bottom:3px}
.ex-ar{font-family:'Tajawal',sans-serif;color:var(--gold);font-size:0.8rem}
.ex-note{font-size:0.68rem;color:var(--muted);margin-top:2px}
.q-item{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.q-text{font-size:0.85rem;margin-bottom:9px;font-family:'Inter',sans-serif}
.q-opts{display:flex;flex-direction:column;gap:5px}
.q-opt{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 12px;cursor:pointer;font-size:0.8rem;text-align:left;color:var(--text);transition:all 0.18s;font-family:'Inter',sans-serif;width:100%}
.q-opt:hover{border-color:rgba(255,255,255,0.2)}
.q-opt.correct{border-color:var(--green);background:rgba(52,211,153,0.07);color:var(--green)}
.q-opt.wrong{border-color:var(--red);background:rgba(248,113,113,0.07);color:var(--red)}
.q-exp{font-family:'Tajawal',sans-serif;font-size:0.75rem;color:var(--muted2);margin-top:6px;padding:6px 10px;background:var(--bg);border-radius:5px;display:none}
.quiz-label{font-family:'IBM Plex Mono',monospace;font-size:0.6rem;color:var(--muted);text-transform:uppercase;margin:14px 0 10px}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.vcard{background:var(--s2);border:1px solid var(--border);border-radius:9px;padding:13px 14px}
.vc-main{display:flex;align-items:baseline;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.vc-word{font-family:'IBM Plex Mono',monospace;font-size:0.95rem;color:#fff;font-weight:600}
.vc-pron{font-family:'IBM Plex Mono',monospace;font-size:0.65rem;color:var(--muted)}
.vc-pos{font-family:'IBM Plex Mono',monospace;font-size:0.58rem;color:var(--accent);background:var(--aglow);border:1px solid rgba(56,189,248,0.2);padding:1px 5px;border-radius:3px}
.vc-ar{font-family:'Tajawal',sans-serif;color:var(--gold);font-size:0.85rem;margin-bottom:4px}
.vc-def{font-size:0.72rem;color:var(--muted2);margin-bottom:8px;line-height:1.4}
.vc-ex{font-size:0.75rem;color:var(--text);font-style:italic;border-left:2px solid var(--a2);padding-left:7px;margin-bottom:10px}
.syns-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.syn-block{border-radius:6px;padding:7px 9px}
.syn-block.acad{background:rgba(167,139,250,0.06);border:1px solid rgba(167,139,250,0.18)}
.syn-block.phrv{background:rgba(251,191,36,0.06);border:1px solid rgba(251,191,36,0.18)}
.syn-lbl{font-family:'IBM Plex Mono',monospace;font-size:0.55rem;text-transform:uppercase;margin-bottom:5px}
.syn-block.acad .syn-lbl{color:var(--purple)}
.syn-block.phrv .syn-lbl{color:var(--gold)}
.syn-item{margin-bottom:5px}
.si-en{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--text);font-weight:600}
.si-ar{font-family:'Tajawal',sans-serif;font-size:0.68rem;color:var(--muted2)}
.si-ex{font-size:0.65rem;color:var(--muted);font-style:italic}
.listen-card{background:var(--s2);border:1px solid var(--border);border-radius:9px;padding:14px;margin-bottom:12px}
.lc-top{display:flex;gap:10px;margin-bottom:12px}
.lc-thumb{width:44px;height:44px;border-radius:7px;background:linear-gradient(135deg,var(--a2),var(--bg));display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.lc-info h4{font-size:0.85rem;font-weight:600;margin-bottom:2px}
.lc-info p{font-size:0.7rem;color:var(--muted)}
.lc-url{display:inline-flex;align-items:center;gap:4px;font-family:'IBM Plex Mono',monospace;font-size:0.65rem;color:#FF6B6B;text-decoration:none;margin-top:4px}
.transcript-box{font-family:'Inter',sans-serif;font-size:0.85rem;line-height:1.85;color:var(--text);background:var(--bg);border-radius:8px;padding:12px;border-left:2px solid var(--cl);margin-bottom:10px}
.shadow-box{background:rgba(167,139,250,0.05);border:1px solid rgba(167,139,250,0.18);border-radius:8px;padding:12px 14px}
.shadow-title{font-family:'IBM Plex Mono',monospace;font-size:0.62rem;color:var(--purple);text-transform:uppercase;margin-bottom:8px}
.shadow-step{display:flex;gap:8px;margin-bottom:6px;font-size:0.78rem;color:var(--muted2)}
.ss-n{font-family:'IBM Plex Mono',monospace;color:var(--purple);flex-shrink:0;font-size:0.65rem}
.read-src{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:0.62rem;color:var(--muted);background:var(--s2);border:1px solid var(--border);border-radius:5px;padding:4px 9px;margin-bottom:10px}
.read-src a{color:var(--accent);text-decoration:none}
.strategy{background:rgba(52,211,153,0.05);border:1px solid rgba(52,211,153,0.15);border-radius:6px;padding:7px 11px;margin-bottom:10px;font-size:0.72rem;color:var(--green);font-family:'IBM Plex Mono',monospace}
.read-text{font-family:'Inter',sans-serif;font-size:0.88rem;line-height:1.9;color:var(--text)}
.read-text p{margin-bottom:12px}
.claude-box{background:linear-gradient(135deg,rgba(56,189,248,0.08),rgba(167,139,250,0.06));border:1px solid rgba(56,189,248,0.2);border-radius:9px;padding:14px 16px;margin-bottom:10px}
.claude-box h4{font-family:'Tajawal',sans-serif;font-size:0.9rem;color:#fff;margin-bottom:6px}
.claude-box p{font-family:'Tajawal',sans-serif;font-size:0.78rem;color:var(--muted2);margin-bottom:12px;line-height:1.6;direction:rtl;text-align:right}
.claude-link{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--bg);padding:9px 20px;border-radius:8px;text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:0.75rem;font-weight:700}
.done-btn{display:block;width:100%;margin-top:16px;background:var(--accent);border:none;color:var(--bg);padding:12px;border-radius:9px;cursor:pointer;font-weight:700;font-size:0.82rem;font-family:'IBM Plex Mono',monospace}
.done-btn.completed{background:rgba(52,211,153,0.15);border:1px solid rgba(52,211,153,0.3);color:var(--green);cursor:default}
.exam-btn{display:block;width:100%;padding:16px;background:linear-gradient(135deg,var(--gold),var(--orange));border:none;border-radius:12px;color:var(--bg);font-weight:800;font-size:1rem;font-family:'Tajawal',sans-serif;cursor:pointer;margin-top:20px}
.exam-section{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:20px;margin-top:16px;display:none}
.exam-q{background:var(--s2);border:1px solid var(--border);border-radius:9px;padding:14px;margin-bottom:12px}
.exam-q-num{font-family:'IBM Plex Mono',monospace;font-size:0.6rem;color:var(--muted);margin-bottom:6px}
.exam-q-text{font-size:0.88rem;margin-bottom:10px;font-family:'Inter',sans-serif}
.exam-opt{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:9px 13px;cursor:pointer;font-size:0.82rem;text-align:left;color:var(--text);font-family:'Inter',sans-serif;display:block;width:100%;margin-bottom:5px}
.exam-opt.correct{border-color:var(--green);background:rgba(52,211,153,0.07);color:var(--green)}
.exam-opt.wrong{border-color:var(--red);background:rgba(248,113,113,0.07);color:var(--red)}
.score-card{background:linear-gradient(135deg,rgba(56,189,248,0.1),rgba(251,191,36,0.07));border:1px solid var(--accent);border-radius:12px;padding:24px;text-align:center;margin-top:16px;display:none}
.score-num{font-family:'IBM Plex Mono',monospace;font-size:3rem;font-weight:700;color:var(--accent);margin-bottom:8px}
.score-label{font-family:'Tajawal',sans-serif;font-size:1rem;color:#fff;margin-bottom:6px}
.score-msg{font-family:'Tajawal',sans-serif;font-size:0.85rem;color:var(--muted2);line-height:1.65;margin-bottom:14px}
.score-breakdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.sb-item{background:var(--s2);border-radius:7px;padding:10px}
.sb-val{font-family:'IBM Plex Mono',monospace;font-size:1rem;font-weight:700;margin-bottom:3px}
.sb-lbl{font-family:'IBM Plex Mono',monospace;font-size:0.58rem;color:var(--muted);text-transform:uppercase}
.milestone{background:linear-gradient(135deg,rgba(56,189,248,0.08),rgba(251,191,36,0.05));border:1px solid var(--accent);border-radius:11px;padding:14px 18px;margin-bottom:18px;display:none;align-items:flex-start;gap:12px}
.ms-ico{font-size:1.6rem;flex-shrink:0}
.ms-txt h3{font-family:'Tajawal',sans-serif;font-size:0.9rem;color:var(--gold2);margin-bottom:3px}
.ms-txt p{font-family:'Tajawal',sans-serif;font-size:0.8rem;color:var(--text);line-height:1.6}
.ms-close{margin-top:8px;background:none;border:1px solid var(--accent);color:var(--accent);padding:4px 12px;border-radius:5px;cursor:pointer;font-size:0.68rem;font-family:'IBM Plex Mono',monospace}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--s2);border-radius:99px}
@media(max-width:600px){.vocab-grid{grid-template-columns:1fr}.syns-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-inner">
    <div class="tb-title">PTE Journey · Phase 1</div>
    <div class="tb-prog">
      <div class="tb-meta"><span id="progLbl">0 / 52 أيام</span><span>A2 → B1</span></div>
      <div class="tb-track"><div class="tb-fill" id="progFill" style="width:0%"></div></div>
    </div>
    <div class="phase-tag">Aug–Sep 2026</div>
  </div>
</header>
<main>
  <div class="milestone" id="msBar">
    <div class="ms-ico" id="msIco">🏆</div>
    <div class="ms-txt"><h3 id="msTitle"></h3><p id="msMsg"></p></div>
    <div><button class="ms-close" onclick="document.getElementById('msBar').style.display='none'">متابعة →</button></div>
  </div>
  <div style="font-family:'IBM Plex Mono',monospace;font-size:0.65rem;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.07em">📅 اختر الأسبوع</div>
  <div class="week-nav" id="weekNav"></div>
  <div class="day-list" id="dayList"></div>
  <div class="lesson-panel" id="lessonPanel">
    <div class="lp-head">
      <div class="lp-title" id="lpTitle">اليوم 1</div>
      <button class="lp-close" onclick="closeLesson()">إغلاق ×</button>
    </div>
    <div class="lp-body" id="lpBody"></div>
  </div>
  <button class="exam-btn" onclick="openExam()">🎓 امتحان نهاية المرحلة الأولى — Phase 1 Final Exam</button>
  <div class="exam-section" id="examSection"></div>
</main>
<script>
const DAYS = [{"day":1,"week":1,"unit":"Unit 1","title":"Present Simple — الأفعال اليومية","grammar":{"unit_ar":"المضارع البسيط","rule_ar":"نستخدم المضارع البسيط للعادات والروتين والحقائق الثابتة. نضيف s أو es مع He/She/It.","formula":"I/You/We/They + V1 | He/She/It + V1+s/es","sub_rules":[{"c":"مع he/she/it — نضيف s","e":"He works at a hospital.","a":"هو يعمل في مستشفى."},{"c":"أفعال تنتهي بـ ch/sh — نضيف es","e":"She watches TV every night.","a":"هي تشاهد التلفاز كل ليلة."},{"c":"النفي — don\'t / doesn\'t","e":"He doesn\'t drink coffee.","a":"هو لا يشرب قهوة."}],"mistake":"❌ He work hard. ✓ He works hard — لا تنسَ الـ s مع الضمائر المفردة!","american_tip":"في الأمريكية gonna تُستخدم كثيراً بدل going to — لكن في الكتابة الرسمية نكتب going to.","yt_url":"https://www.youtube.com/results?search_query=present+simple+شرح+بالعربي+A2","examples":[{"e":"I wake up at 6 AM every day.","a":"أستيقظ كل يوم الساعة 6 صباحاً.","n":"روتين يومي"},{"e":"She drinks tea, not coffee.","a":"هي تشرب شاياً وليس قهوة.","n":"عادة شخصية"},{"e":"Water boils at 100 degrees.","a":"يغلي الماء عند 100 درجة.","n":"حقيقة علمية"},{"e":"They don\'t work on weekends.","a":"هم لا يعملون في نهاية الأسبوع.","n":"نفي العادة"}],"quiz":[{"q":"She ___ (study) every evening.","o":["study","studies","studys","is study"],"a":1,"exp":"مع she نضيف es لأن study تنتهي بـ y → studies"},{"q":"They ___ (not/like) spicy food.","o":["doesn\'t like","don\'t likes","don\'t like","not like"],"a":2,"exp":"مع they نستخدم don\'t + فعل أصلي"},{"q":"Water ___ (freeze) at 0°C.","o":["freeze","freezes","is freezing","froze"],"a":1,"exp":"حقيقة علمية + He/She/It = freezes"},{"q":"How often ___ you ___ (go) to the gym?","o":["do / goes","does / go","do / go","are / going"],"a":2,"exp":"مع you نستخدم do + فعل أصلي"}]},"vocab":[{"w":"routine","p":"/ruːˈtiːn/","pos":"noun","ar":"روتين / عادة يومية","def":"a regular sequence of actions","ex":"My morning routine starts with exercise.","ac":[{"w":"regimen","ar":"نظام / برنامج","ex":"The doctor prescribed a strict daily regimen."},{"w":"protocol","ar":"بروتوكول / إجراء","ex":"Follow the hospital protocol carefully."},{"w":"procedure","ar":"إجراء / خطوات","ex":"The admission procedure takes 30 minutes."}],"pv":[{"p":"stick to","ar":"يلتزم بـ","ex":"Stick to your study routine every day."},{"p":"carry out","ar":"ينفّذ","ex":"Carry out your tasks before lunch."},{"p":"keep up","ar":"يواصل","ex":"Keep up the good work!"}]},{"w":"habit","p":"/ˈhæbɪt/","pos":"noun","ar":"عادة","def":"a regular tendency hard to give up","ex":"Reading before bed is a good habit.","ac":[{"w":"tendency","ar":"ميل / نزعة","ex":"She has a tendency to arrive early."},{"w":"disposition","ar":"استعداد / طبع","ex":"His disposition toward learning is admirable."},{"w":"inclination","ar":"ميل / رغبة","ex":"He has an inclination for medical science."}],"pv":[{"p":"fall into","ar":"يقع في عادة","ex":"Don\'t fall into bad habits."},{"p":"give up","ar":"يتخلى عن","ex":"He gave up smoking last year."},{"p":"cut out","ar":"يقطع","ex":"Cut out junk food from your diet."}]},{"w":"schedule","p":"/ˈskɛdʒuːl/","pos":"noun","ar":"جدول / يجدول","def":"a plan listing events and when they happen","ex":"I have a busy schedule this week.","ac":[{"w":"timetable","ar":"جدول زمني","ex":"The timetable shows all exam dates."},{"w":"agenda","ar":"جدول أعمال","ex":"Please review the meeting agenda."},{"w":"itinerary","ar":"خطة / برنامج","ex":"The conference itinerary is attached."}],"pv":[{"p":"pencil in","ar":"يدرج مؤقتاً","ex":"Let\'s pencil in Tuesday for our meeting."},{"p":"fit in","ar":"يجد وقتاً لـ","ex":"Can you fit in a study session today?"},{"p":"block out","ar":"يحجز وقتاً","ex":"Block out two hours for grammar review."}]}],"listening":{"title":"Daily Routines — VOA Learning English","channel":"VOA Learning English","emoji":"📻","dur":"4:12","url":"https://learningenglish.voanews.com/a/daily-routines/3227598.html","focus":"Present Simple in context — listen for -s endings","shadow":"Connected speech: He wakes up sounds like He-wakes-up (linked)","transcript":"Maria starts her day at 6 AM. She drinks coffee and reads the news. Then she goes to work. She meets her colleagues and reviews the schedule. She usually finishes at 5 PM and takes the bus home."},"reading":{"title":"Morning Habits of Successful People","source":"ReadTheory — Grade 4","url":"https://readtheory.org","strategy":"SQ3R: Survey → Question → Read → Recite → Review","text":"<p>Many successful people share common morning habits. They wake up early, often before sunrise. They use this quiet time to exercise, meditate, or plan their day.</p><p>Studies show that people who wake up early are more productive. They have more time to focus on important tasks before distractions begin. A healthy breakfast also helps them stay focused throughout the morning.</p><p>Creating a morning routine is not difficult. Start small — wake up 15 minutes earlier each week. Add one healthy habit at a time. Soon, your mornings will set the tone for a successful day.</p>","quiz":[{"q":"What do many successful people do in the morning?","o":["A. Sleep late","B. Wake up early and exercise","C. Watch television","D. Skip breakfast"],"a":1,"exp":"النص: They wake up early... they exercise"},{"q":"Why is waking up early helpful?","o":["A. It is tradition","B. It allows time before distractions","C. It makes people sleepy","D. It is medically required"],"a":1,"exp":"النص: more time to focus before distractions begin"},{"q":"What advice does the author give for building a morning routine?","o":["A. Change everything at once","B. Sleep less immediately","C. Start small and add habits gradually","D. Wake up at midnight"],"a":2,"exp":"Start small — wake up 15 minutes earlier each week"}]},"writing_prompt":"اذهب إلى Claude.ai واطلب: Act as my English writing teacher. I am A2 level. Ask me to write 5 sentences about my daily routine using Present Simple. Then correct my grammar and give me feedback.","speaking_prompt":"اذهب إلى Claude.ai واطلب: Act as my English speaking partner. Ask me 5 questions about my daily routine. Correct any Present Simple errors I make and explain why."},{"day":2,"week":1,"unit":"Unit 2","title":"Present Simple — الأسئلة والنفي","grammar":{"unit_ar":"المضارع البسيط: الأسئلة والنفي","rule_ar":"لتكوين السؤال نستخدم Do أو Does في بداية الجملة. للنفي نستخدم don\'t أو doesn\'t قبل الفعل الأصلي.","formula":"Do/Does + Subject + V1? | Subject + don\'t/doesn\'t + V1","sub_rules":[{"c":"سؤال مع I/You/We/They","e":"Do you speak English?","a":"هل تتحدث الإنجليزية؟"},{"c":"سؤال مع He/She/It","e":"Does she work here?","a":"هل تعمل هنا؟"},{"c":"Wh- Questions","e":"Where do you live?","a":"أين تسكن؟"}],"mistake":"❌ Does she works here? ✓ Does she work here? — بعد does الفعل يرجع لأصله بدون s","american_tip":"الأمريكيون يقولون Yeah بدل Yes في المحادثة، لكن في الكتابة الرسمية نكتب Yes.","yt_url":"https://www.youtube.com/results?search_query=present+simple+questions+شرح+عربي","examples":[{"e":"Do you have a car?","a":"هل لديك سيارة؟","n":"سؤال مع you"},{"e":"Does he eat meat?","a":"هل يأكل اللحم؟","n":"سؤال مع he"},{"e":"Where do they live?","a":"أين يسكنون؟","n":"Wh-question"},{"e":"She doesn\'t understand Arabic.","a":"هي لا تفهم العربية.","n":"نفي مع she"}],"quiz":[{"q":"___ she live near the hospital?","o":["Do","Does","Is","Are"],"a":1,"exp":"مع she نستخدم Does في الأسئلة"},{"q":"They ___ (not/speak) French.","o":["doesn\'t speak","don\'t speaks","don\'t speak","not speak"],"a":2,"exp":"مع they: don\'t + فعل أصلي"},{"q":"Where ___ your parents work?","o":["does","do","is","are"],"a":1,"exp":"مع your parents (they) نستخدم do"},{"q":"___ it snow in Jordan?","o":["Do","Does","Is","Has"],"a":1,"exp":"مع it نستخدم Does"}]},"vocab":[{"w":"understand","p":"/ˌʌndəˈstænd/","pos":"verb","ar":"يفهم / يستوعب","def":"to know the meaning of something","ex":"I don\'t understand this grammar rule.","ac":[{"w":"comprehend","ar":"يستوعب","ex":"She couldn\'t comprehend the complex text."},{"w":"grasp","ar":"يُدرك بسرعة","ex":"He quickly grasped the concept."},{"w":"perceive","ar":"يُدرك","ex":"Students perceived the difference clearly."}],"pv":[{"p":"figure out","ar":"يفهم / يكتشف","ex":"I finally figured out how to use the app."},{"p":"catch on","ar":"يبدأ يفهم","ex":"It took me a week to catch on."},{"p":"pick up","ar":"يتعلم / يلتقط","ex":"She picks up new languages quickly."}]},{"w":"ask","p":"/æsk/","pos":"verb","ar":"يسأل / يطلب","def":"to say something as a question or to request","ex":"Always ask your teacher when you don\'t understand.","ac":[{"w":"inquire","ar":"يستفسر","ex":"Please inquire at the front desk."},{"w":"request","ar":"يطلب رسمياً","ex":"The patient requested a private room."},{"w":"query","ar":"يتساءل","ex":"She queried the accuracy of the report."}],"pv":[{"p":"ask for","ar":"يطلب شيئاً","ex":"Ask for help when you need it."},{"p":"ask around","ar":"يسأل عدة أشخاص","ex":"I asked around about good tutors."},{"p":"bring up","ar":"يطرح موضوعاً","ex":"She brought up an important question."}]},{"w":"know","p":"/noʊ/","pos":"verb","ar":"يعرف / يعلم","def":"to have information about something in your mind","ex":"Do you know how to drive?","ac":[{"w":"be aware of","ar":"يكون على دراية بـ","ex":"Are you aware of the new policy?"},{"w":"recognize","ar":"يتعرف على","ex":"I recognize this patient from last week."},{"w":"acknowledge","ar":"يُقرّ","ex":"He acknowledged his mistake."}],"pv":[{"p":"find out","ar":"يكتشف","ex":"Let me find out the answer for you."},{"p":"look up","ar":"يبحث عن معلومة","ex":"Look up the word in the dictionary."},{"p":"come across","ar":"يصادف","ex":"I came across a useful website."}]}],"listening":{"title":"Asking Questions in English — VOA","channel":"VOA Learning English","emoji":"🎙️","dur":"3:45","url":"https://learningenglish.voanews.com/a/asking-and-answering-questions/3227599.html","focus":"Question formation — Do/Does patterns","shadow":"Intonation: voice goes UP for yes/no questions, DOWN for Wh- questions","transcript":"Learning to ask questions is essential. In English, we use do and does to form questions. Do you speak English? or Does she work here? Notice how the voice rises at the end of yes/no questions, but falls at the end of Wh- questions like Where do you live?"},"reading":{"title":"The Art of Asking Good Questions","source":"ReadTheory — Grade 4","url":"https://readtheory.org","strategy":"Skimming: اقرأ العناوين والجملة الأولى من كل فقرة أولاً","text":"<p>Asking good questions is a skill. Good questions help us learn more about the world and connect with people.</p><p>There are different types of questions. Closed questions have a yes or no answer. Open questions invite longer answers. For example, Do you like your job? is closed. What do you enjoy most about your job? is open.</p><p>People who ask good questions often learn faster. They show they are interested. If you want to improve your English, ask at least three questions every day.</p>","quiz":[{"q":"What is the difference between closed and open questions?","o":["A. Open questions need more words","B. Closed: yes/no; open: longer answers","C. Closed questions are rude","D. No difference"],"a":1,"exp":"Closed: yes or no. Open: invite longer answers"},{"q":"Which is an example of an open question?","o":["A. Do you like coffee?","B. Is this correct?","C. What do you enjoy most about your job?","D. Does she live here?"],"a":2,"exp":"الأسئلة المفتوحة تبدأ بـ What/How/Why"},{"q":"Why do question-askers learn faster?","o":["A. They memorize more","B. They show interest and engagement","C. They ask closed questions","D. They never make mistakes"],"a":1,"exp":"They show that they are interested and engaged"}]},"writing_prompt":"اذهب إلى Claude.ai واطلب: I am A2 level English learner. Give me 10 sentences and ask me to turn each into a question using Do/Does. Correct me and explain mistakes.","speaking_prompt":"اذهب إلى Claude.ai واطلب: Be my conversation partner. I will ask you 5 yes/no questions and 5 Wh-questions about your life. Correct my question formation if I make mistakes."},{"day":3,"week":1,"unit":"Unit 3","title":"Present Continuous — ما يحدث الآن","grammar":{"unit_ar":"المضارع المستمر","rule_ar":"نستخدم المضارع المستمر للأفعال التي تحدث الآن أو في هذه المرحلة المؤقتة. نكوّنه بـ am/is/are + فعل + ing.","formula":"Subject + am/is/are + V-ing","sub_rules":[{"c":"حدث يجري الآن","e":"She is studying English right now.","a":"هي تدرس الإنجليزية الآن."},{"c":"تغيير مؤقت","e":"I am living with my parents this month.","a":"أسكن مع أهلي هذا الشهر مؤقتاً."},{"c":"المستقبل المرتب","e":"We are meeting tomorrow at 9.","a":"سنجتمع غداً الساعة 9."}],"mistake":"❌ I am knowing the answer. ✓ I know the answer — أفعال الحالة لا تأتي في المستمر!","american_tip":"I\'m good = شعور جيد. I\'m doing good = أداء جيد. كلاهما مقبول في الأمريكية العامية.","yt_url":"https://www.youtube.com/results?search_query=present+continuous+شرح+بالعربي","examples":[{"e":"I am learning English this year.","a":"أنا أتعلم الإنجليزية هذه السنة.","n":"تغيير مؤقت"},{"e":"She is not sleeping — she is reading.","a":"هي لا تنام — هي تقرأ.","n":"نفي المستمر"},{"e":"What are you doing right now?","a":"ماذا تفعل الآن؟","n":"سؤال بالمستمر"},{"e":"The situation is changing quickly.","a":"الوضع يتغير بسرعة.","n":"تغيير جارٍ"}],"quiz":[{"q":"Listen! The baby ___ (cry).","o":["cries","is crying","crying","cry"],"a":1,"exp":"Listen! = الفعل يحدث الآن → is crying"},{"q":"I ___ (not/watch) TV. I ___ (study).","o":["am not watching / am studying","don\'t watch / study","isn\'t watching / studying","not watching / am studying"],"a":0,"exp":"فعلان مستمران مع I = am not watching / am studying"},{"q":"Why ___ you ___ (smile)?","o":["do / smile","are / smiling","is / smiling","do / smiling"],"a":1,"exp":"سؤال عن فعل يحدث الآن → are + smiling"},{"q":"She ___ (know) the answer. [state verb]","o":["is knowing","are knowing","knows","is know"],"a":2,"exp":"know فعل حالة لا يأتي في صيغة المستمر"}]},"vocab":[{"w":"improve","p":"/ɪmˈpruːv/","pos":"verb","ar":"يتحسن / يُحسّن","def":"to become better or make something better","ex":"My English is improving every day.","ac":[{"w":"enhance","ar":"يُعزز","ex":"This method enhances language skills."},{"w":"advance","ar":"يتقدم","ex":"She advanced rapidly in her studies."},{"w":"develop","ar":"يطوّر","ex":"We need to develop communication skills."}],"pv":[{"p":"get better","ar":"يتحسن تدريجياً","ex":"My speaking is getting better each week."},{"p":"brush up on","ar":"ينعش معلوماته","ex":"I need to brush up on my grammar."},{"p":"work on","ar":"يعمل على","ex":"I\'m working on my pronunciation."}]},{"w":"focus","p":"/ˈfoʊkəs/","pos":"verb","ar":"يُركّز","def":"to give your attention to something in particular","ex":"I need to focus on listening skills.","ac":[{"w":"concentrate","ar":"يُركّز جهده","ex":"Concentrate on the main idea."},{"w":"emphasize","ar":"يُؤكّد على","ex":"The teacher emphasized grammar rules."},{"w":"prioritize","ar":"يضع في أولوياته","ex":"Prioritize speaking practice daily."}],"pv":[{"p":"zero in on","ar":"يُركّز تماماً على","ex":"Zero in on your weak areas."},{"p":"pay attention to","ar":"يولي اهتماماً لـ","ex":"Pay attention to pronunciation."},{"p":"tune out","ar":"يتجاهل","ex":"Don\'t tune out during lectures."}]},{"w":"change","p":"/tʃeɪndʒ/","pos":"verb","ar":"يتغير / التغيير","def":"to become different or make something different","ex":"My life is changing in many ways.","ac":[{"w":"transform","ar":"يتحوّل","ex":"Education can transform your future."},{"w":"alter","ar":"يُعدّل","ex":"We need to alter our approach."},{"w":"evolve","ar":"يتطور","ex":"Language evolves over time."}],"pv":[{"p":"switch to","ar":"يتحول إلى","ex":"Switch to English when you can."},{"p":"move on","ar":"يمضي قُدُماً","ex":"Let\'s move on to the next unit."},{"p":"turn into","ar":"يتحوّل إلى","ex":"Practice turns into habit."}]}],"listening":{"title":"What Are You Doing? — Present Continuous","channel":"VOA Learning English","emoji":"🎬","dur":"5:10","url":"https://learningenglish.voanews.com/a/american-english/2773302.html","focus":"Am/Is/Are + V-ing in real conversations","shadow":"Contractions: I\'m she\'s they\'re — practice linking","transcript":"Right now, millions of people around the world are learning English. They are studying grammar, reading books, and watching videos. Technology is making it easier than ever. Online platforms are connecting learners with teachers from every country. The world of English learning is changing fast."},"reading":{"title":"The World Is Changing","source":"ReadTheory — Grade 5","url":"https://readtheory.org","strategy":"Context Clues: خمّن معنى الكلمات الجديدة من السياق","text":"<p>The world around us is always changing. New technologies are appearing every day. Cities are growing larger and faster than before. People are moving from villages to cities in record numbers.</p><p>Climate is also changing. Temperatures are rising in many parts of the world. Scientists are studying these changes carefully. They are working on solutions to protect our planet.</p><p>However, some things are not changing. People are still helping each other. Communities are still coming together during difficult times. The human spirit of cooperation is as strong as ever.</p>","quiz":[{"q":"Which sentence uses Present Continuous to show a current change?","o":["A. Cities grew larger last year","B. Cities are growing larger and faster","C. Cities grow larger every year","D. Cities will grow larger"],"a":1,"exp":"are growing = تغيير يحدث الآن"},{"q":"What are scientists doing?","o":["A. Ignoring climate change","B. Studying it and working on solutions","C. Moving to cities","D. Growing food"],"a":1,"exp":"Scientists are studying... They are working on solutions"},{"q":"What does the author say is NOT changing?","o":["A. Technology","B. Cities","C. Climate","D. Human cooperation"],"a":3,"exp":"The human spirit of cooperation is as strong as ever"}]},"writing_prompt":"اذهب إلى Claude.ai واطلب: I am A2 English learner. Ask me to describe what I am doing right now and what is changing in my life. Use Present Continuous. Correct my mistakes.","speaking_prompt":"اذهب إلى Claude.ai واطلب: Pretend you are calling me on the phone. Ask what I am doing, watching, and what changes I am making this month. Correct my Present Continuous errors."},{"day":4,"week":1,"unit":"Unit 4","title":"Present Simple vs Continuous","grammar":{"unit_ar":"المضارع البسيط مقابل المستمر","rule_ar":"المضارع البسيط = عادات وحقائق ثابتة. المضارع المستمر = أفعال تحدث الآن أو مؤقتاً. الكلمات المفتاحية تساعدنا في الاختيار.","formula":"Always/Usually/Often → Simple | Now/Right now/At the moment → Continuous","sub_rules":[{"c":"عادة = Simple","e":"He usually drives to work.","a":"هو عادةً يقود للعمل."},{"c":"الآن = Continuous","e":"Today he is taking the bus.","a":"اليوم هو يركب الباص (مؤقت)."},{"c":"حقيقة = Simple","e":"The sun rises in the east.","a":"الشمس تشرق من الشرق."}],"mistake":"❌ I am knowing French. ✓ I know French — أفعال الحالة: know/love/hate/want/need لا تأتي في Continuous","american_tip":"I\'m lovin' it (McDonald\'s) — خطأ نحوي مقصود للإعلان! في الكلام العادي: I love it","yt_url":"https://www.youtube.com/results?search_query=present+simple+vs+continuous+شرح+عربي","examples":[{"e":"She works in a hospital. (permanent job)","a":"هي تعمل في مستشفى. (دائم)","n":"Simple = حقيقة دائمة"},{"e":"She is working from home today. (temporary)","a":"هي تعمل من البيت اليوم.","n":"Continuous = وضع مؤقت"},{"e":"He always eats breakfast.","a":"هو دائماً يأكل الإفطار.","n":"Simple + always"},{"e":"He is eating breakfast right now.","a":"هو يأكل الإفطار الآن.","n":"Continuous + right now"}],"quiz":[{"q":"I ___ (usually/get up) at 7, but today I ___ (sleep) late.","o":["usually get up / am sleeping","am usually getting up / sleep","usually gets up / sleeping","get usually up / am sleeping"],"a":0,"exp":"عادة = Simple | اليوم = Continuous"},{"q":"Water ___ (boil) at 100°C. Right now it ___.","o":["boils / is boiling","is boiling / boils","boil / boiling","boils / boils"],"a":0,"exp":"حقيقة = boils | الآن = is boiling"},{"q":"Tom is in Italy. He ___ (learn) Italian.","o":["learns","is learning","learn","is learn"],"a":1,"exp":"At the moment + وضع مؤقت = Continuous"},{"q":"I ___ (believe) he is honest. [state verb]","o":["am believing","believe","is believing","believing"],"a":1,"exp":"believe فعل حالة → لا تستخدمه مستمراً"}]},"vocab":[{"w":"temporary","p":"/ˈtempəreri/","pos":"adjective","ar":"مؤقت","def":"lasting for only a limited period of time","ex":"This is a temporary arrangement, not permanent.","ac":[{"w":"transient","ar":"عابر / زائل","ex":"The pain is transient and will pass."},{"w":"provisional","ar":"مؤقت / مبدئي","ex":"A provisional schedule has been set."},{"w":"interim","ar":"مؤقت رسمي","ex":"She is the interim manager."}],"pv":[{"p":"fill in for","ar":"يحل مكان مؤقتاً","ex":"I\'m filling in for my colleague."},{"p":"hold on","ar":"ينتظر مؤقتاً","ex":"Hold on — this is just temporary."},{"p":"stand in","ar":"يقوم مقام غيره","ex":"Can you stand in for me today?"}]},{"w":"permanent","p":"/ˈpɜːrmənənt/","pos":"adjective","ar":"دائم / ثابت","def":"lasting or intended to last for a very long time","ex":"I am looking for a permanent job.","ac":[{"w":"enduring","ar":"دائم / مستمر","ex":"His enduring commitment is impressive."},{"w":"persistent","ar":"مستمر / متواصل","ex":"Her persistent effort paid off."},{"w":"established","ar":"راسخ / ثابت","ex":"This is an established practice."}],"pv":[{"p":"stay on","ar":"يبقى / يستمر","ex":"She decided to stay on permanently."},{"p":"settle down","ar":"يستقر","ex":"He finally settled down in his career."},{"p":"stick around","ar":"يبقى","ex":"Stick around — this job is permanent."}]},{"w":"difference","p":"/ˈdɪfərəns/","pos":"noun","ar":"فرق / اختلاف","def":"a way in which two things are not the same","ex":"What\'s the difference between these two tenses?","ac":[{"w":"distinction","ar":"تمييز / فارق","ex":"There is a clear distinction between them."},{"w":"contrast","ar":"تباين / تضاد","ex":"In contrast, the second method is faster."},{"w":"discrepancy","ar":"تناقض / اختلاف","ex":"There is a discrepancy in the results."}],"pv":[{"p":"tell apart","ar":"يُميّز بين","ex":"Can you tell these two words apart?"},{"p":"set apart","ar":"يُميّز","ex":"Good grammar sets you apart."},{"p":"stand out","ar":"يبرز","ex":"Her accent stands out in class."}]}],"listening":{"title":"Habits vs. Current Activities — VOA","channel":"VOA Learning English","emoji":"🎧","dur":"4:30","url":"https://learningenglish.voanews.com/a/everyday-grammar-simple-vs-progressive/3143856.html","focus":"Contrasting Simple and Continuous","shadow":"Key words: usually/always (Simple) vs. right now/at the moment (Continuous)","transcript":"John normally works in an office. But this week, he is working from home. He usually takes the subway, but today he is walking to his home office. He always drinks two cups of coffee in the morning. Right now, he is drinking his first cup and reading emails."},"reading":{"title":"A Day in Two Lives","source":"ReadTheory — Grade 5","url":"https://readtheory.org","strategy":"Compare and Contrast: ابحث عن أوجه الشبه والاختلاف","text":"<p>Maria usually works at a hospital from 8 to 4. She always wears her uniform and carries her medical bag. But today she is visiting a school to teach children about health.</p><p>Her colleague Ahmed normally drives to work. He often listens to English podcasts in the car. However, right now he is sitting on a train. His car is being repaired.</p><p>Both Maria and Ahmed love their jobs. They believe that helping people is the most rewarding work in the world. And even when their routines change, they always maintain their positive attitude.</p>","quiz":[{"q":"What is Maria doing today that is different from her routine?","o":["A. Working at the hospital","B. Wearing her uniform","C. Visiting a school to teach","D. Carrying her medical bag"],"a":2,"exp":"today is different. She is visiting a school"},{"q":"Why is Ahmed on a train?","o":["A. He doesn\'t have a car","B. His car is being repaired","C. He likes trains","D. The hospital is far"],"a":1,"exp":"His car is being repaired, so he is using public transportation"},{"q":"Which word signals a HABIT?","o":["A. right now","B. today","C. this week","D. always"],"a":3,"exp":"always = عادة دائمة → Present Simple"}]},"writing_prompt":"اذهب إلى Claude.ai واطلب: I am A2. Give me a paragraph with blanks. I must choose between Present Simple and Present Continuous. Correct me and explain each answer in Arabic.","speaking_prompt":"اذهب إلى Claude.ai واطلب: Ask me about my normal daily routine AND what I am doing differently this week. Help me use both Present Simple and Present Continuous correctly."},{"day":5,"week":1,"unit":"Unit 5","title":"State Verbs — أفعال الحالة","grammar":{"unit_ar":"أفعال الحالة — State Verbs","rule_ar":"أفعال الحالة تعبّر عن مشاعر وأفكار وحواس ثابتة. لا تُستخدم في صيغة المستمر أبداً. نستخدمها في المضارع البسيط دائماً.","formula":"State Verbs → NEVER use with -ing (in most cases)","sub_rules":[{"c":"أفعال العقل والتفكير","e":"I believe / think / know / understand / remember","a":"أؤمن / أعتقد / أعرف / أفهم / أتذكر"},{"c":"أفعال المشاعر","e":"I love / like / hate / want / need / prefer","a":"أحب / أُفضّل / أكره / أريد / أحتاج"},{"c":"أفعال الحواس","e":"This tastes / sounds / smells / feels / looks good","a":"هذا طيب الطعم / الصوت / الرائحة / اللمس / المظهر"}],"mistake":"❌ I am wanting coffee. ✓ I want coffee | ❌ She is knowing. ✓ She knows","american_tip":"I\'m thinking about it = مقبول! think يمكن أن يأتي بصيغة مستمرة عند معنى التفكير النشط.","yt_url":"https://www.youtube.com/results?search_query=state+verbs+stative+verbs+شرح+عربي","examples":[{"e":"I love this song.","a":"أنا أحب هذه الأغنية.","n":"love = state verb"},{"e":"She knows three languages.","a":"هي تعرف ثلاث لغات.","n":"know = state verb"},{"e":"This soup smells delicious.","a":"رائحة هذه الشوربة لذيذة.","n":"smell = state"},{"e":"I don\'t understand this word.","a":"أنا لا أفهم هذه الكلمة.","n":"understand = state verb"}],"quiz":[{"q":"I ___ (believe) you. You\'re telling the truth.","o":["am believing","believe","am believe","believing"],"a":1,"exp":"believe فعل حالة → لا نستخدمه مستمراً"},{"q":"She ___ (not/want) any sugar in her coffee.","o":["isn\'t wanting","doesn\'t want","don\'t want","not wanting"],"a":1,"exp":"want فعل حالة → Present Simple مع النفي"},{"q":"This music ___ (sound) amazing!","o":["is sounding","sounds","are sounding","sounding"],"a":1,"exp":"sound كفعل حاسة = state verb → Simple"},{"q":"He ___ (think) about the problem now. [active thinking]","o":["thinks","thought","is thinking","think"],"a":2,"exp":"think بمعنى التفكير النشط الآن = يمكن استخدام Continuous!"}]},"vocab":[{"w":"believe","p":"/bɪˈliːv/","pos":"verb","ar":"يُؤمن / يُصدّق","def":"to feel certain that something is true","ex":"I believe practice makes perfect.","ac":[{"w":"maintain","ar":"يرى / يُؤكد رأياً","ex":"Researchers maintain that sleep is vital."},{"w":"assert","ar":"يُؤكد / يجزم","ex":"She asserted that the results were valid."},{"w":"contend","ar":"يُجادل / يزعم","ex":"He contends that grammar is overrated."}],"pv":[{"p":"stand by","ar":"يبقى مؤمناً بـ","ex":"I stand by what I said."},{"p":"hold to","ar":"يتمسك بـ","ex":"She holds to traditional methods."},{"p":"come around to","ar":"يقتنع تدريجياً","ex":"He came around to my opinion."}]},{"w":"prefer","p":"/prɪˈfɜːr/","pos":"verb","ar":"يُفضّل","def":"to like someone or something more than another","ex":"I prefer studying in the morning.","ac":[{"w":"favor","ar":"يُفضّل / يُحبّذ","ex":"Most students favor interactive methods."},{"w":"opt for","ar":"يختار","ex":"She opted for the online course."},{"w":"incline toward","ar":"يميل نحو","ex":"He inclines toward visual learning."}],"pv":[{"p":"go for","ar":"يختار","ex":"I\'ll go for the grammar book."},{"p":"lean toward","ar":"يميل نحو","ex":"I lean toward audio learning."},{"p":"be into","ar":"يُحبّ / مهتم بـ","ex":"She\'s really into podcasts."}]},{"w":"remember","p":"/rɪˈmembər/","pos":"verb","ar":"يتذكر","def":"to have an image in your mind of a past event","ex":"I remember my first English lesson.","ac":[{"w":"recall","ar":"يتذكر / يسترجع","ex":"Can you recall the main grammar rules?"},{"w":"retain","ar":"يحتفظ بـ معلومة","ex":"Spaced repetition helps retain vocabulary."},{"w":"recollect","ar":"يتذكر بجهد","ex":"I can\'t recollect his name."}],"pv":[{"p":"look back on","ar":"يستعيد ذكرى","ex":"Look back on how far you\'ve come."},{"p":"come to mind","ar":"يتبادر إلى الذهن","ex":"A good example comes to mind."},{"p":"bring back","ar":"يستحضر ذكرى","ex":"This song brings back memories."}]}],"listening":{"title":"Feelings and States — VOA","channel":"VOA Learning English","emoji":"💭","dur":"4:00","url":"https://learningenglish.voanews.com/a/everyday-grammar-stative-verbs/3163090.html","focus":"State verbs in natural conversation","shadow":"Notice: I know, I want, I love — no -ing even in fast speech","transcript":"Many English learners say I am knowing or I am wanting. But these are incorrect. State verbs describe conditions, not actions. When something is a state like a feeling or a belief — we use Present Simple. I love learning. I believe in myself. I understand the rule now."},"reading":{"title":"What You Feel vs. What You Do","source":"ReadTheory — Grade 5","url":"https://readtheory.org","strategy":"Underlining: ضع خطاً تحت أفعال الحالة في النص","text":"<p>Our inner world is full of states and feelings. We know things. We believe in ideas. We love certain people. We want things we do not yet have. These states are part of who we are.</p><p>Unlike actions, states are not things we do — they simply exist. You cannot perform love or carry out knowledge. That is why state verbs like love, know, and believe do not work in continuous form.</p><p>Understanding this helps English learners speak naturally. When a feeling exists, use simple form. When an action is happening, use continuous form. It is a small rule, but it makes a big difference.</p>","quiz":[{"q":"What makes state verbs different?","o":["A. They are shorter words","B. States simply exist and are not performed","C. They are always negative","D. They only work in continuous"],"a":1,"exp":"states are not things we do — they simply exist"},{"q":"Which is a state verb?","o":["A. run","B. write","C. believe","D. listen"],"a":2,"exp":"النص يذكر: love, know, believe كأفعال حالة"},{"q":"What does the author say about using state verbs in continuous form?","o":["A. It is recommended","B. It is sometimes correct","C. It does not work","D. It is American English"],"a":2,"exp":"state verbs do not work in the continuous form"}]},"writing_prompt":"اذهب إلى Claude.ai واطلب: Quiz me on state verbs. Give me 10 sentences where I must decide if the verb is correct or wrong. If wrong, I must correct it. Explain each answer.","speaking_prompt":"اذهب إلى Claude.ai واطلب: Ask me about my preferences, beliefs, and feelings using state verbs. If I use any state verb in -ing form by mistake, immediately correct me."},{"day":6,"week":1,"unit":"Unit 6","title":"He/She/It — الضمائر المفردة","grammar":{"unit_ar":"المضارع البسيط مع الضمائر المفردة","rule_ar":"عند استخدام He/She/It في المضارع البسيط نضيف s أو es للفعل. هناك قواعد تهجئة مهمة يجب حفظها.","formula":"He/She/It + V+s/es/ies","sub_rules":[{"c":"معظم الأفعال: نضيف s","e":"He work→works | She eat→eats","a":"هو يعمل | هي تأكل"},{"c":"أفعال تنتهي بـ ch/sh/ss/x/o: نضيف es","e":"She watch→watches | He go→goes","a":"تشاهد | يذهب"},{"c":"أفعال تنتهي بـ y بعد حرف ساكن: ies","e":"study→studies | try→tries","a":"يدرس | يحاول"}],"mistake":"❌ She go to school. ✓ She goes | ❌ He studys. ✓ He studies","american_tip":"She\'s gotta = She has got to (must) في الأمريكية العامية. في الرسمي: She must / She has to.","yt_url":"https://www.youtube.com/results?search_query=third+person+singular+s+es+ies+شرح+عربي","examples":[{"e":"He teaches at a university.","a":"هو يُدرّس في جامعة.","n":"teach → teaches (+es)"},{"e":"She studies two hours daily.","a":"هي تدرس ساعتين يومياً.","n":"study → studies (y→ies)"},{"e":"It rains a lot in winter.","a":"تمطر كثيراً في الشتاء.","n":"rain → rains (+s)"},{"e":"He doesn\'t finish work until 6.","a":"هو لا ينتهي حتى الساعة 6.","n":"نفي: doesn\'t + أصل الفعل"}],"quiz":[{"q":"She ___ (study) medicine at university.","o":["studys","studies","is studying","study"],"a":1,"exp":"study تنتهي بـ y بعد حرف ساكن → ies"},{"q":"He ___ (watch) English movies every weekend.","o":["watchs","watch","watches","is watching"],"a":2,"exp":"watch تنتهي بـ ch → نضيف es"},{"q":"The train ___ (leave) at exactly 8:05.","o":["leave","leaves","is leaving","leaved"],"a":1,"exp":"the train (it) → leaves"},{"q":"My brother ___ (not/play) football anymore.","o":["doesn\'t plays","don\'t play","doesn\'t play","isn\'t play"],"a":2,"exp":"نفي مع he: doesn\'t + أصل الفعل بدون s"}]},"vocab":[{"w":"practice","p":"/ˈpræktɪs/","pos":"noun/verb","ar":"يُمارس / ممارسة","def":"to do something regularly to improve your skill","ex":"She practices English for one hour every day.","ac":[{"w":"exercise","ar":"يُمارس / تمرين","ex":"Exercise your speaking skills daily."},{"w":"rehearse","ar":"يتدرب","ex":"Rehearse the conversation before class."},{"w":"drill","ar":"تكرار / تدريب","ex":"Grammar drills help build accuracy."}],"pv":[{"p":"keep at","ar":"يُواصل التدريب","ex":"Keep at it — you\'re improving!"},{"p":"put in","ar":"يبذل جهداً","ex":"Put in the hours and you\'ll succeed."},{"p":"go over","ar":"يُراجع مجدداً","ex":"Go over the exercise one more time."}]},{"w":"daily","p":"/ˈdeɪli/","pos":"adjective","ar":"يومي / يومياً","def":"happening or done every day","ex":"Daily practice is the key to fluency.","ac":[{"w":"regular","ar":"منتظم / متكرر","ex":"Regular study leads to steady progress."},{"w":"consistent","ar":"متسق / منتظم","ex":"Be consistent in your study habits."},{"w":"systematic","ar":"منهجي / منظّم","ex":"A systematic approach works best."}],"pv":[{"p":"day in day out","ar":"كل يوم بلا انقطاع","ex":"Study day in day out for best results."},{"p":"on a daily basis","ar":"على أساس يومي","ex":"Practice on a daily basis."},{"p":"keep up with","ar":"يواكب","ex":"Keep up with your daily lessons."}]},{"w":"skill","p":"/skɪl/","pos":"noun","ar":"مهارة","def":"the ability to do something well through training","ex":"Speaking is the most important language skill.","ac":[{"w":"competence","ar":"كفاءة / جدارة","ex":"She demonstrated high competence in English."},{"w":"proficiency","ar":"إتقان","ex":"His proficiency in writing improved greatly."},{"w":"expertise","ar":"خبرة / تخصص","ex":"He has expertise in medical English."}],"pv":[{"p":"pick up","ar":"يكتسب مهارة","ex":"She picked up the skill quickly."},{"p":"hone","ar":"يُصقل","ex":"Hone your speaking skills with Cambly."},{"p":"build up","ar":"يبني / يطوّر","ex":"Build up your vocabulary gradually."}]}],"listening":{"title":"Learning About Third Person -s","channel":"VOA Learning English","emoji":"📖","dur":"3:50","url":"https://learningenglish.voanews.com/a/everyday-grammar/2766939.html","focus":"Noticing -s/-es/-ies endings in natural speech","shadow":"The -s ending is often very soft — train your ear to catch it","transcript":"In English, the verb changes when we talk about another person. She works. He teaches. It happens. Notice the -s or -es at the end. This is called third person singular. When we say she studies, we change y to ies. When we say he watches, we add es. This rule applies to all regular verbs."},"reading":{"title":"A Student Who Never Gives Up","source":"ReadTheory — Grade 4","url":"https://readtheory.org","strategy":"Main Idea: ابحث عن الفكرة الرئيسية في أول جملة من كل فقرة","text":"<p>Sofia studies English every morning before work. She wakes up at 5:30, makes coffee, and opens her grammar book. She believes early morning is the best time to learn.</p><p>At work, she speaks English with her foreign colleagues. She often makes small mistakes, but she never feels embarrassed. She knows that mistakes help you learn. When she does not understand a word, she writes it in her notebook.</p><p>Her English teacher says she is one of the best students. He admires her discipline and dedication. Sofia proves that small daily habits, practiced consistently, lead to big results.</p>","quiz":[{"q":"What does Sofia do every morning?","o":["A. Watches TV","B. Studies English and reads grammar","C. Calls her teacher","D. Goes to the gym"],"a":1,"exp":"She wakes up at 5:30, makes coffee, and opens her grammar book"},{"q":"How does Sofia feel about making mistakes?","o":["A. She feels embarrassed","B. She stops speaking","C. She believes mistakes help learning","D. She never makes mistakes"],"a":2,"exp":"she never feels embarrassed. She knows that mistakes help you learn"},{"q":"What does Sofia do with new words?","o":["A. Ignores them","B. Asks a friend","C. Writes them in her notebook","D. Stops reading"],"a":2,"exp":"she writes it in her notebook and looks it up later"}]},"writing_prompt":"اذهب إلى Claude.ai واطلب: Give me a paragraph about a person\'s daily life. I must rewrite it changing all verbs to third person singular. Correct my -s/-es/-ies endings.","speaking_prompt":"اذهب إلى Claude.ai واطلب: Ask me about what my best friend or family member does every day. I need to practice He/She + verb+s/es. Correct any third person errors."},{"day":7,"week":2,"unit":"Unit 7","title":"Past Simple — الماضي البسيط","grammar":{"unit_ar":"الماضي البسيط","rule_ar":"درس Unit 7: Past Simple — الماضي البسيط — راجع Grammar in Use American English وحدة 7 مع الشرح بالعربي من يوتيوب.","formula":"See Grammar in Use Unit 7","sub_rules":[{"c":"راجع الكتاب","e":"Open Grammar in Use American English","a":"Unit 7: Past Simple — الماضي البسيط"}],"mistake":"راجع الأخطاء الشائعة في Unit 7 من Grammar in Use.","american_tip":"Watch VOA Learning English for American pronunciation o function checkMS(n){
  const m=MS.find(x=>x.at===n);
  if(!m)return;
  const b=document.getElementById('msBar');
  document.getElementById('msIco').textContent=m.ico;
  document.getElementById('msTitle').textContent=m.t;
  document.getElementById('msMsg').textContent=m.m;
  b.style.display='flex';
  b.scrollIntoView({behavior:'smooth'});
}

// ═══════════════ PROGRESS ═══════════════
function updateProg(){
  const n=done.size, pct=Math.round((n/52)*100);
  document.getElementById('progLbl').textContent=`${n} / 52 أيام (${pct}%)`;
  document.getElementById('progFill').style.width=pct+'%';
}

// ═══════════════ WEEK NAV ═══════════════
function buildNav(){
  const nav=document.getElementById('weekNav');
  nav.innerHTML='';
  for(let w=1;w<=9;w++){
    const days=DAYS.filter(d=>d.week===w);
    const allDone=days.length>0&&days.every(d=>done.has(d.day));
    const btn=document.createElement('button');
    btn.className='wk-btn'+(allDone?' done':'');
    btn.textContent=`أسبوع ${w}`;
    btn.onclick=()=>{
      document.querySelectorAll('.wk-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderList(w);
    };
    nav.appendChild(btn);
  }
}

// ═══════════════ DAY LIST ═══════════════
function renderList(week){
  const list=document.getElementById('dayList');
  list.innerHTML='';
  const days=DAYS.filter(d=>d.week===week);
  if(!days.length){
    list.innerHTML='<div style="padding:20px;text-align:center;font-family:Tajawal,sans-serif;color:var(--muted)">لا توجد دروس في هذا الأسبوع</div>';
    return;
  }
  days.forEach(d=>{
    const isDone=done.has(d.day);
    const el=document.createElement('div');
    el.className='day-card'+(isDone?' done':'');
    el.id='dc'+d.day;
    el.innerHTML=`
      <div class="dc-num">Day ${d.day}</div>
      <div class="dc-info">
        <div class="dc-title">${d.title}</div>
        <div class="dc-sub">${d.unit} · Grammar + Vocab + Listening + Reading</div>
      </div>
      <div style="font-size:1rem">${isDone?'✅':'○'}</div>`;
    el.onclick=()=>openDay(d.day);
    list.appendChild(el);
  });
}

// ═══════════════ OPEN LESSON ═══════════════
function openDay(dayNum){
  const d=DAYS.find(x=>x.day===dayNum);
  if(!d)return;
  activeDay=dayNum;
  document.querySelectorAll('.day-card').forEach(c=>c.classList.remove('active'));
  const dc=document.getElementById('dc'+dayNum);
  if(dc){dc.classList.add('active');}
  document.getElementById('lpTitle').textContent=`Day ${d.day}: ${d.title}`;
  document.getElementById('lpBody').innerHTML=buildLesson(d);
  const panel=document.getElementById('lessonPanel');
  panel.style.display='block';
  panel.scrollIntoView({behavior:'smooth'});
  bindQuiz(d);
}

function closeLesson(){
  document.getElementById('lessonPanel').style.display='none';
  document.querySelectorAll('.day-card').forEach(c=>c.classList.remove('active'));
  activeDay=null;
}

function esc(s){ return (s||'').replace(/'/g,"\'").replace(/"/g,'&quot;'); }

// ═══════════════ QUIZ ANSWERS ═══════════════
function ansGQ(day,qi,j,ans,exp){
  const el=document.getElementById(`gq${day}_${qi}`);
  el.querySelectorAll('.q-opt').forEach((b,k)=>{
    b.disabled=true;
    if(k===ans)b.classList.add('correct');
    else if(k===j)b.classList.add('wrong');
  });
  const e=document.getElementById(`gqe${day}_${qi}`);
  e.textContent='💡 '+exp; e.style.display='block';
}
function ansRQ(day,qi,j,ans,exp){
  const el=document.getElementById(`rq${day}_${qi}`);
  el.querySelectorAll('.q-opt').forEach((b,k)=>{
    b.disabled=true;
    if(k===ans)b.classList.add('correct');
    else if(k===j)b.classList.add('wrong');
  });
  const e=document.getElementById(`rqe${day}_${qi}`);
  e.textContent='💡 '+exp; e.style.display='block';
}

// ═══════════════ MARK DONE ═══════════════
function markDone(dayNum){
  done.add(dayNum);
  saveState();
  updateProg();
  const btn=document.getElementById('doneBtn'+dayNum);
  if(btn){btn.textContent='✅ درس مكتمل';btn.classList.add('completed');}
  const dc=document.getElementById('dc'+dayNum);
  if(dc){dc.classList.add('done');dc.querySelector('div:last-child').textContent='✅';}
  checkMS(done.size);
  // Auto-open next day
  const next=DAYS.find(x=>x.day===dayNum+1);
  if(next){
    setTimeout(()=>{
      const nextWk=document.querySelectorAll('.wk-btn')[next.week-1];
      if(nextWk&&next.week!==DAYS.find(x=>x.day===dayNum)?.week){
        nextWk.click();
      }
    },500);
  }
}

          <div class="exam-q-text">${q.q}</div>
          ${q.o.map((o,j)=>`<button class="exam-opt" onclick="ansExam('${sec.id}',${i},${j},${q.a},'${esc(q.exp)}')">${o}</button>`).join('')}
          <div id="ee_${sec.id}_${i}" style="display:none;font-family:'Tajawal',sans-serif;font-size:0.75rem;color:var(--muted2);margin-top:6px;padding:6px 10px;background:var(--bg);border-radius:5px"></div>
        </div>`).join('')}
    </div>`;
  });

  html+=`
    <div style="margin-bottom:20px">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:0.7rem;color:var(--cw);text-transform:uppercase;margin-bottom:10px;padding:5px 12px;background:rgba(251,146,60,0.1);border-radius:5px;display:inline-block">Writing & Speaking — على Claude.ai</div>
      <div class="claude-box">
        <h4>✍️ Writing Exam</h4>
        <p>${EXAM.claude_writing}</p>
        <a class="claude-link" href="https://claude.ai" target="_blank">✍️ افتح Claude.ai →</a>
      </div>
      <div class="claude-box">
        <h4>🗣️ Speaking Exam</h4>
        <p>${EXAM.claude_speaking}</p>
        <a class="claude-link" href="https://claude.ai" target="_blank">🗣️ افتح Claude.ai →</a>
      </div>
    </div>
    <button onclick="showScore()" style="display:block;width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),var(--orange));border:none;border-radius:10px;color:var(--bg);font-weight:800;font-size:0.9rem;font-family:'Tajawal',sans-serif;cursor:pointer">📊 عرض نتيجة الامتحان</button>
    <div class="score-card" id="scoreCard"></div>`;

  document.getElementById('examSection').innerHTML=html;
}

function ansExam(sid,qi,j,ans,exp){
  const el=document.getElementById(`eq_${sid}_${qi}`);
  el.querySelectorAll('.exam-opt').forEach((b,k)=>{
    b.disabled=true;
    if(k===ans)b.classList.add('correct');
    else if(k===j)b.classList.add('wrong');
  });
  document.getElementById(`ee_${sid}_${qi}`).textContent='💡 '+exp;
  document.getElementById(`ee_${sid}_${qi}`).style.display='block';
  if(!examResults[sid])examResults[sid]={c:0,t:0};
  examResults[sid].t++;
  if(j===ans)examResults[sid].c++;
}

function showScore(){
  let tc=0,tt=0;
  const bd=EXAM.sections.map(s=>{
    const r=examResults[s.id]||{c:0,t:s.questions.length};
    tc+=r.c; tt+=r.t||s.questions.length;
    const pct=r.t>0?Math.round((r.c/r.t)*100):0;
    return{id:s.id,title:s.title,pct,color:s.color};
  });
  const overall=tt>0?Math.round((tc/tt)*100):0;
  const weak=bd.filter(b=>b.pct<60).map(b=>b.id);
  let msg,lvl;
  if(overall>=85){msg='ممتاز يا ماجد! أنت جاهز للمرحلة الثانية. مستواك يُعادل B1 متقن.';lvl='B1+'}
  else if(overall>=70){msg='جيد جداً! راجع نقاط ضعفك أدناه قبل الانتقال للمرحلة الثانية.';lvl='B1'}
  else if(overall>=55){msg='جيد مع حاجة لمراجعة. ادرس الأقسام الضعيفة مجدداً.';lvl='A2+'}
  else{msg='تحتاج مراجعة إضافية. لا تستعجل — القواعد القوية هي الأساس.';lvl='A2'}

  const sc=document.getElementById('scoreCard');
  sc.innerHTML=`
    <div class="score-num">${overall}%</div>
    <div class="score-label">المستوى المحقق: ${lvl}</div>
    <div class="score-msg">${msg}</div>
    <div class="score-breakdown">
      ${bd.map(b=>`<div class="sb-item"><div class="sb-val" style="color:${b.pct>=60?b.color:'var(--red)'}">${b.pct}%</div><div class="sb-lbl">${b.id}</div></div>`).join('')}
    </div>
    ${weak.length>0?`<div style="background:rgba(248,113,113,0.06);border:1px solid rgba(248,113,113,0.2);border-radius:9px;padding:12px 14px;margin-bottom:14px;text-align:right"><div style="font-family:'IBM Plex Mono',monospace;font-size:0.62rem;color:var(--red);margin-bottom:6px">⚠ نقاط الضعف للمرحلة الثانية</div><div style="font-family:'Tajawal',sans-serif;font-size:0.82rem;color:var(--muted2)">اطلب من Claude التركيز على: <strong style="color:var(--red)">${weak.join(' · ')}</strong></div></div>`:''}
    <a href="https://claude.ai" target="_blank" style="display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:var(--bg);padding:10px 22px;border-radius:8px;text-decoration:none;font-family:'Tajawal',sans-serif;font-size:0.85rem;font-weight:700">
      📤 أخبر Claude بنتيجتك واطلب المرحلة الثانية ↗
    </a>
    <div style="font-family:'Tajawal',sans-serif;font-size:0.75rem;color:var(--muted2);margin-top:10px;line-height:1.65;direction:rtl;text-align:right">
      قل لـ Claude: "أنهيت امتحان المرحلة الأولى بنتيجة ${overall}٪. ${weak.length>0?'نقاط ضعفي: '+weak.join('، ')+'. ':''}صمّم لي دروس المرحلة الثانية مع التركيز على نقاط ضعفي."
    </div>`;
  sc.style.display='block';
  sc.scrollIntoView({behavior:'smooth'});
}

  updateProg();
  buildNav();
  // Auto-open week 1
  const firstBtn=document.querySelector('.wk-btn');

});

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.log('SW registration failed:',err));
  });
}
